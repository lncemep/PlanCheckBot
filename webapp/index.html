<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Запрещаем масштабирование -->
  <meta name="viewport" 
        content="width=device-width, initial-scale=1.0, 
                 maximum-scale=1.0, 
                 user-scalable=no" />
  <title data-translate="title_page">PlanCheckBot</title>
  <!-- Подключаем Bootstrap 5 (CDN) -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
  />
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* Дополнительно убираем прокрутку */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* Отключить прокрутку */
      background-color: #f8f9fa;
    }
    .content-container {
      overflow-y: auto; /* Но для задач пусть будет вертикальная прокрутка */
      height: calc(100% - 56px); /* Navbar ~56px */
      padding: 1rem;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1" data-translate="navbar_title">Plan Check Bot</span>
      <!-- Больше не показываем кнопку Статистика -->
    </div>
  </nav>

  <!-- Основной блок -->
  <div class="content-container" id="app-container">
    <div class="mb-2" id="status-message" style="font-weight: bold;"></div>
    <div id="tasks-container" class="row g-3"></div>
  </div>

  <!-- Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  </script>
  <!-- Наш главный скрипт -->
  <script src="script.js"></script>
</body>
</html>
